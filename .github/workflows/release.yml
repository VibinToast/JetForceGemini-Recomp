# Releases start by themselves when something is merged into main. The branch it came from picks the version:
#
#   release/<x.y>              -> exactly x.y.0   release/1.2 -> 1.2.0
#   dev                        -> minor   1.1.8 -> 1.2.0   (only if dev is merged straight into main; normally a release/x.y is)
#   hotfix/<name>              -> patch   1.1.8 -> 1.1.9
#   rt64-update, milestone/*   -> major   1.1.8 -> 2.0.0
#
# A label on the pull request wins over the branch: release:major, release:minor, release:patch, or release:none (no
# release). A push straight to main (no pull request) is released only when its commit message says [major], [minor] or
# [patch], or when it is a local "Merge branch 'release/1.2'" (or 'dev', 'hotfix/...') commit. [no release] in the
# message skips the release.
# By hand: GitHub -> Actions -> "Release" -> "Run workflow" on main, with a bump or an exact version.
#
# What it does:
# - The release notes are the "## Unreleased" section at the top of CHANGELOG.md, written by hand on the release branch
#   while it is in testing; that section becomes "## vX.Y.Z (date)". Without one (a quick hotfix, say), the notes are
#   the commit messages instead (first line of each, newest first) since the last release, so commit messages should
#   still read well to players. That list leaves out commits that only change the README, .gitignore, .recomp.json,
#   docs and other files players do not see, "WIP" commits and the commits listed in .github/changelog-skip.txt.
# - Puts them at the top of CHANGELOG.md (the game shows that file under Changelogs), writes the version into version.txt
#   (the launcher shows it), commits both to main and makes a DRAFT release vX.Y.Z on that commit. Players do not see a
#   draft, and the launcher's update check skips it.
# - Merges main back into dev, rt64-update and any open release/* branch, so the release commit, the release branch's
#   fixes and any hotfix are there too (BACK_MERGE below). A hotfix made while a release is in testing reaches it this way.
#
# It does not build the game: the game's code is translated from the owner's own ROM, which never goes to GitHub. The
# builds are made on the owner's PC: tools\package_release.bat (Windows) and tools/package_release.sh (Linux) find the
# draft by themselves, build its exact commit, upload the files and publish the release once every file is there.
# See RELEASING.md in the owner's Recomp-Docs notes.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Which number to raise (not used when an exact version is typed below)
        type: choice
        options: [minor, patch, major]
        default: minor
      version:
        description: Exact version instead, three numbers (for example 2.0.0). Leave empty to use the bump.
        type: string
        required: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  BACK_MERGE: dev rt64-update   # branches that get main merged back into them after a release (missing ones are skipped),
                                # plus every release/* branch on GitHub

jobs:
  release:
    runs-on: ubuntu-latest
    # The workflow's own release commit is never released again.
    if: "!startsWith(github.event.head_commit.message, 'chore: release v')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the bump
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$REF" != main ]; then
            echo "Releases are made from main only, not from '$REF'." >&2
            exit 1
          fi
          bump="" exact="" why=""
          if [ "$EVENT" = workflow_dispatch ]; then
            exact="${INPUT_VERSION#v}"
            bump="$INPUT_BUMP"
            why="started by hand"
          else
            # The pull request that made this commit: its labels and the branch it came from.
            pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0] // {}')
            head=$(jq -r '.head.ref // ""' <<< "$pr")
            labels=" $(jq -r '[.labels[]?.name] | join(" ")' <<< "$pr") "
            number=$(jq -r '.number // ""' <<< "$pr")
            subject=$(head -n 1 <<< "$MESSAGE")
            if [ -z "$head" ]; then
              # A merge made locally and pushed: "Merge branch 'dev'" or "Merge branch 'dev' into main".
              head=$(sed -n "s/^Merge branch '\([^']*\)'.*/\1/p" <<< "$subject")
            fi
            case "$labels" in
              *" release:none "*)  bump=none;  why="label release:none" ;;
              *" release:major "*) bump=major; why="label release:major" ;;
              *" release:minor "*) bump=minor; why="label release:minor" ;;
              *" release:patch "*) bump=patch; why="label release:patch" ;;
            esac
            if [ -z "$bump" ]; then
              case "$MESSAGE" in
                *"[no release]"*) bump=none;  why="[no release] in the commit message" ;;
                *"[major]"*)      bump=major; why="[major] in the commit message" ;;
                *"[minor]"*)      bump=minor; why="[minor] in the commit message" ;;
                *"[patch]"*)      bump=patch; why="[patch] in the commit message" ;;
              esac
            fi
            if [ -z "$bump" ]; then
              case "$head" in
                release/*)
                  if [[ "${head#release/}" =~ ^[0-9]+\.[0-9]+$ ]]; then
                    exact="${head#release/}.0"; bump=minor; why="merged from $head"
                  else
                    echo "A release branch is named release/<major>.<minor> (for example release/1.2), not '$head'." >&2
                    exit 1
                  fi ;;
                dev)                          bump=minor; why="merged from dev" ;;
                hotfix/*|hotfix-*)            bump=patch; why="merged from $head" ;;
                rt64-update|milestone/*)      bump=major; why="merged from $head" ;;
              esac
            fi
            [ -n "$number" ] && why="$why (pull request #$number)"
            if [ -z "$bump" ]; then
              bump=none
              why="no pull request from release/*, dev, hotfix/* or rt64-update, no release:* label and no [major]/[minor]/[patch] in the commit message"
            fi
          fi
          echo "Bump: ${exact:-$bump} ($why)"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "exact=$exact" >> "$GITHUB_OUTPUT"
          if [ "$bump" = none ] && [ -z "$exact" ]; then
            echo "### No release" >> "$GITHUB_STEP_SUMMARY"
            echo "$why." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Work out the version
        id: version
        if: ${{ steps.bump.outputs.bump != 'none' || steps.bump.outputs.exact != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ steps.bump.outputs.bump }}
          EXACT: ${{ steps.bump.outputs.exact }}
        run: |
          # One release at a time: a draft still waiting for its builds has to be published (or deleted) first.
          waiting=$(gh release list --limit 50 --json tagName,isDraft --jq '[.[] | select(.isDraft) | .tagName] | join(" ")')
          if [ -n "$waiting" ]; then
            echo "$waiting is still a draft waiting for its builds. Run tools\\package_release.bat and tools/package_release.sh" >&2
            echo "to build and publish it (or delete the draft), then start this workflow by hand: Actions -> Release -> Run workflow." >&2
            exit 1
          fi
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -n "$EXACT" ]; then
            new="$EXACT"
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            major=${major:-0} minor=${minor:-0} patch=${patch:-0}
            case "$BUMP" in
              major) new="$((major + 1)).0.0" ;;
              minor) new="$major.$((minor + 1)).0" ;;
              patch) new="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          if ! [[ "$new" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The version must be three numbers like 1.0.0, not '$new'." >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$new" > /dev/null; then
            echo "Tag v$new already exists." >&2
            exit 1
          fi
          if [ -n "$last" ]; then
            if [ "$(printf '%s\n%s\n' "${last#v}" "$new" | sort -V | tail -n 1)" != "$new" ]; then
              echo "v$new is not newer than the last release, $last." >&2
              exit 1
            fi
            if [ "$(git rev-list --count "$last..HEAD")" = 0 ]; then
              echo "Nothing new since $last, so there is nothing to release." >&2
              exit 1
            fi
            range="$last..HEAD"
          else
            range=HEAD
          fi
          echo "Releasing v$new (last release: ${last:-none})"
          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "last=$last" >> "$GITHUB_OUTPUT"
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: Write the release notes and update the changelog
        if: ${{ steps.version.outputs.version != '' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          LAST: ${{ steps.version.outputs.last }}
          RANGE: ${{ steps.version.outputs.range }}
          REPO: ${{ github.repository }}
        run: |
          # Commits that change only files players do not care about (repository files, documentation, README images,
          # release tools) are left out. Keep IGNORED in step with changelog_ignored_file in src/jfg/jfg_update_check.cpp.
          python3 - <<'PY'
          import os, subprocess
          IGNORED_FILES = {"README.md", "LICENSE", "CHANGELOG.md", "version.txt", ".gitignore", ".gitattributes",
                           ".recomp.json", "tools/package_release.ps1", "tools/package_release.bat",
                           "tools/package_release.sh", "tools/set_version.py"}
          IGNORED_FOLDERS = (".github/", "docs/", "images/", "tools/linux-build/")
          # Commits listed in .github/changelog-skip.txt (a full hash at the start of a line) and "WIP" commits are left
          # out too.
          SKIPPED = set()
          if os.path.exists(".github/changelog-skip.txt"):
              for line in open(".github/changelog-skip.txt", encoding="utf-8"):
                  word = line.split("#", 1)[0].split()
                  if word:
                      SKIPPED.add(word[0].lower())
          def ignored(path):
              return path in IGNORED_FILES or path.startswith(IGNORED_FOLDERS)
          log = subprocess.run(["git", "log", "--no-merges", "--format=%H%x09%s", os.environ["RANGE"]],
                               capture_output=True, text=True, check=True).stdout
          lines, seen = [], set()
          for entry in log.splitlines():
              sha, _, subject = entry.partition("\t")
              subject = subject.strip()
              if (not subject or subject.startswith(("chore: release v", "WIP")) or subject in seen
                      or sha.lower() in SKIPPED):
                  continue
              files = subprocess.run(["git", "diff-tree", "--no-commit-id", "--name-only", "-r", sha],
                                     capture_output=True, text=True, check=True).stdout.split()
              if files and all(ignored(f) for f in files):
                  continue
              seen.add(subject)
              lines.append("- " + subject)
          open("commits.md", "w", encoding="utf-8").write("\n".join(lines) + ("\n" if lines else ""))
          PY
          python3 - <<'PY'
          import datetime, os, re
          version = os.environ["VERSION"]
          last = os.environ["LAST"]
          text = open("CHANGELOG.md", encoding="utf-8").read() if os.path.exists("CHANGELOG.md") else "# Changelog\n"
          # The hand-written "## Unreleased" section is the release notes: it becomes this version's section. With no
          # such section, or only the heading (and <!-- comments -->) in it, the notes are the commit list instead.
          written = ""
          m = re.search(r"^## Unreleased\b[^\n]*\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          if m:
              written = re.sub(r"<!--.*?-->", "", m.group(1), flags=re.S).strip()
              text = text[:m.start()] + text[m.end():]
          body = written or open("commits.md", encoding="utf-8").read().strip() or "- Maintenance"
          print("Release notes from", "the Unreleased section of CHANGELOG.md" if written else "the commit messages")
          heading = "## v%s (%s)" % (version, datetime.date.today().isoformat())
          section = heading + "\n\n" + body + "\n\n"
          m = re.search(r"^## ", text, re.M)
          if m:
              text = text[:m.start()] + section + text[m.start():]
          else:
              text = text.rstrip("\n") + "\n\n" + section
          open("CHANGELOG.md", "w", encoding="utf-8").write(text)
          notes = body
          if last:
              notes += "\n\n**Full changelog**: https://github.com/%s/compare/%s...v%s" % (os.environ["REPO"], last, version)
          open("notes.md", "w", encoding="utf-8").write(notes + "\n")
          PY
          echo "${VERSION}" > version.txt

      - name: Commit and push
        if: ${{ steps.version.outputs.version != '' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md version.txt
          git commit -m "chore: release v$VERSION [skip ci]"
          git push origin HEAD:main

      - name: Make the draft release
        if: ${{ steps.version.outputs.version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        # A draft gets its tag v$VERSION (on the release commit) when it is published.
        run: |
          gh release create "v$VERSION" --draft --title "v$VERSION" --notes-file notes.md --target "$(git rev-parse HEAD)"
          {
            echo "### Draft v$VERSION is waiting for its builds"
            echo
            echo "On Windows run \`tools\\package_release.bat\`, on Linux \`tools/package_release.sh\`. Each finds this draft,"
            echo "builds commit \`$(git rev-parse --short HEAD)\`, uploads its files, and publishes the release once every file is there."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Merge main back into dev
        if: ${{ steps.version.outputs.version != '' }}
        run: |
          main=$(git rev-parse HEAD)
          releases=$(git ls-remote --heads origin 'release/*' | sed 's#.*refs/heads/##')
          for branch in $BACK_MERGE $releases; do
            if ! git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
              echo "No branch $branch, skipped."
              continue
            fi
            git fetch origin "$branch"
            git checkout -q -B "$branch" "origin/$branch"
            if git merge --no-edit -m "Merge main (release) into $branch [skip ci]" "$main"; then
              git push origin "$branch"
              echo "Merged main into $branch."
            else
              git merge --abort
              echo "::warning::main could not be merged into $branch (conflicts). Merge it by hand: git switch $branch && git merge origin/main"
            fi
          done
