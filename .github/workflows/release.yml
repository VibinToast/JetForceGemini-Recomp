# Manual releases: you decide when, and you type the version. Nothing happens on a normal push.
#
# To release: GitHub -> Actions -> "Release" -> "Run workflow", pick the branch and type the version (for example 1.0.0).
#
# - The version must be three numbers, X.Y.Z, and must not have been released before. The tag is vX.Y.Z.
# - The release notes are the commit messages (first line of each, newest first) between the last release tag and the
#   branch being released: nothing to write by hand, so write commit messages that read well to players.
# - It adds them to the top of CHANGELOG.md as the new version (the game shows that file under Changelogs), writes the
#   version into version.txt (which goes into the game's launcher), commits both, tags vX.Y.Z and publishes the
#   GitHub release.
#
# This does not build the game. The game's code is translated from the owner's own ROM, so it cannot be built on
# GitHub. The portable zip is made on the owner's PC with tools/package_release.bat, which uploads it to this release
# as JFG-X.Y.Z-windows-x64-portable.zip. GitHub attaches the source zip and tar.gz itself.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, three numbers (for example 1.0.0)
        type: string
        required: true
        default: 1.0.0

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          new="${VERSION#v}"
          if ! [[ "$new" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The version must be three numbers like 1.0.0, not '$VERSION'." >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$new" > /dev/null; then
            echo "Tag v$new already exists." >&2
            exit 1
          fi
          last=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$last" ]; then
            range=HEAD
          else
            if [ "$(git rev-list --count "$last..HEAD")" = 0 ]; then
              echo "Nothing new since $last, so there is nothing to release." >&2
              exit 1
            fi
            range="$last..HEAD"
          fi
          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "last=$last" >> "$GITHUB_OUTPUT"
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: Write the release notes and update the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
          LAST: ${{ steps.version.outputs.last }}
          RANGE: ${{ steps.version.outputs.range }}
          REPO: ${{ github.repository }}
        run: |
          git log --no-merges --format='%s' "$RANGE" | grep -vE '^chore: release v' | sed -E '/^$/d; s/^/- /' | awk '!seen[$0]++' > commits.md || true
          python3 - <<'PY'
          import datetime, os, re
          version = os.environ["VERSION"]
          last = os.environ["LAST"]
          text = open("CHANGELOG.md", encoding="utf-8").read() if os.path.exists("CHANGELOG.md") else "# Changelog\n"
          # A leftover hand-written "Unreleased" section is dropped: the notes come from the commits only.
          text = re.sub(r"^## Unreleased[ \t]*\n.*?(?=^## |\Z)", "", text, flags=re.S | re.M)
          body = open("commits.md", encoding="utf-8").read().strip() or "- Maintenance"
          heading = "## v%s (%s)" % (version, datetime.date.today().isoformat())
          section = heading + "\n\n" + body + "\n\n"
          m = re.search(r"^## ", text, re.M)
          if m:
              text = text[:m.start()] + section + text[m.start():]
          else:
              text = text.rstrip("\n") + "\n\n" + section
          open("CHANGELOG.md", "w", encoding="utf-8").write(text)
          notes = body
          if last:
              notes += "\n\n**Full changelog**: https://github.com/%s/compare/%s...v%s" % (os.environ["REPO"], last, version)
          open("notes.md", "w", encoding="utf-8").write(notes + "\n")
          PY
          echo "${VERSION}" > version.txt

      - name: Commit and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md version.txt
          git commit -m "chore: release v$VERSION [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        # The release creates the tag v$VERSION on the release commit through GitHub's API. (Pushing the tag with git was
        # rejected for the workflow's token: "remote rejected ... (failed)".)
        run: gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md --target "$(git rev-parse HEAD)"
