# N64Recomp config for Jet Force Gemini (US): the main segment and the 155 overlays.
#
# Input: the user's own ROM, pre-linked by tools/prepare_overlays.py (overlays at private addresses from 0x82000000),
# plus JFGRecompSyms/jfg.us.syms.toml (function symbols from the matching decomp ELF; a submodule shared with mods).
# Before running N64Recomp, run tools/refuse_mod_hooks.py; after it, tools/merge_gen_anim_data.py and
# tools/fix_dynamic_relocs.py on the output directory (the build scripts do all of this).
[input]
symbols_file_path = "JFGRecompSyms/jfg.us.syms.toml"
rom_file_path = "baserom.us.recomp.z64"
output_func_path = "RecompiledFuncs"

# Game functions the port wraps instead of changing them (the port's N64Recomp fork): each listed <name> is generated
# as <name>_orig, and RecompiledFuncs/jfg_wrapped.c defines <name>, which calls jfg_wrap_<name> (src/jfg/), which calls
# <name>_orig. jfg_register_wrapped() tells the runtime that mods' patches and hooks apply to <name>_orig.
[wrappers]
funcs_list = "tools/wrapped_funcs.txt"
wrapper_prefix = "jfg_wrap_"
register_func = "jfg_register_wrapped"
output_file = "jfg_wrapped.c"

[patches]
# Functions mods can't hook (rom_size 0 in the function table): listed by tools/refuse_mod_hooks.py, run first.
unhookable_funcs_list = "RecompiledFuncs/unhookable_funcs.txt"
# Entry points inside the gen_anim_data blob (0x80073E80-0x80074E50, recompiled as one function, see
# JFGRecompSyms/jfg.us.syms.toml): not generated separately; tools/merge_gen_anim_data.py writes a wrapper for each
# entry point.
# Only the two that have sized symbols need listing here; the other 13 are size-0 labels N64Recomp never sees.
ignored = [
    "func_80074A68",
    "func_80074B50",
]
# Game functions whose names collide with the host C runtime (MSVC declares `_itoa`); emitted with a `_recomp` suffix.
renamed = ["_itoa"]
# RSP microcode images linked into the CPU text section (splat `textbin`); they carry function-typed symbols but are
# not R4300 code. Audio and graphics microcode are handled separately (RSPRecomp / RT64).
stubs = [
    "D_8009DA10_9E610", # ucode_audio        (ROM 0x9E610, 6208 bytes)
    "D_8009F250_9FE50", # ucode_boot (rspboot) (ROM 0x9FE50, 384 bytes)
    "D_8009F3D0_9FFD0", # ucode_f3ddkr_dram  (ROM 0x9FFD0, 4752 bytes)
]

# gen_anim_data.s: `jr $s1` through a 2-entry table at 0x800A7478 whose entry 0 is NULL and entry 1 is the
# instruction right after the delay slot (0x80074E34). N64Recomp cannot size a table starting with NULL.
# Replacing the jr with a nop falls through to the only valid target; behaviour differs only for index 0,
# which would jump to address 0 on hardware.
[[patches.instruction]]
vram = 0x80074E2C
func = "gen_anim_data"
value = 0x00000000

# 60 fps: the squad system (enemies, tribals; overlay 3) at the game's 30 fps cadence (src/jfg/jfg_frame_rate.cpp,
# jfg_squad_frames). Much of it works per tick whatever the frame count, so at 60 fps squad members moved, animated and
# attacked about twice as fast. In 60 fps mode SquaddieControl(obj, frames), SquadronControl(obj, frames) and
# squadsModuleTick(frames) run on every second tick only, with the frames of both ticks.
# Not hooks here: the three are wrapped (tools/wrapped_funcs.txt, jfg_frame_rate.cpp), so mods can hook or replace
# them and the cadence still applies around the game's code or the mod's.

# Smooth Shadows (src/jfg/jfg_shadow_interp.cpp): func_8001FA24 writes each shadow's triangles; where its scales and
# the object's place are worked out (before the first triangle) and after the last, the batch and how far its image
# slides on in-between frames are passed to RT64. Hooks, not a wrapper: the scales, the angle's sine and cosine and
# the object's place are only in registers there, and the function calls nothing that could mark the point. So mods
# can't hook func_8001FA24 (tools/refuse_mod_hooks.py); they can still replace it.
[[patches.hook]]
func = "func_8001FA24_20624"
before_vram = 0x8001FCC4
text = "{ void jfg_shadow_begin(uint8_t*, recomp_context*); jfg_shadow_begin(rdram, ctx); }"

[[patches.hook]]
func = "func_8001FA24_20624"
before_vram = 0x8001FF6C
text = "{ void jfg_shadow_end(uint8_t*, recomp_context*); jfg_shadow_end(rdram, ctx); }"
