# N64Recomp config for Jet Force Gemini (US) — MAIN SEGMENT ONLY (overlays are not recompiled yet).
#
# Input: the user's own ROM plus jfg.us.syms.toml (function symbols exported from the matching decomp ELF).
# After running N64Recomp, run tools/merge_gen_anim_data.py on the output directory.
[input]
symbols_file_path = "jfg.us.syms.toml"
rom_file_path = "baserom.us.recomp.z64"
output_func_path = "RecompiledFuncs"

[patches]
# Entry points inside the gen_anim_data blob (0x80073E80-0x80074E50, recompiled as one function, see
# jfg.us.syms.toml): not generated separately; tools/merge_gen_anim_data.py writes a wrapper for each entry point.
# Only the two that have sized symbols need listing here; the other 13 are size-0 labels N64Recomp never sees.
ignored = [
    # Anti-tamper: read words that the CIC-6105 IPL3 boot code leaves in RDRAM, through KSEG1 (0xA02FB1F4 and
    # 0xA02FE1C0), and expect 0xAD090010 / 0xAD170014. A native process has no IPL3 stage; the port provides native
    # versions that report the genuine-hardware result (src/jfg/jfg_glue.cpp).
    "osBootRamTest1_6105",
    "osBootRamTest2_6105",
    "func_80074A68",
    "func_80074B50",
]
# Game functions whose names collide with the host C runtime (MSVC declares `_itoa`); emitted with a `_recomp` suffix.
renamed = ["_itoa"]
# RSP microcode images linked into the CPU text section (splat `textbin`); they carry function-typed symbols but are
# not R4300 code. Audio and graphics microcode are handled separately (RSPRecomp / RT64).
stubs = [
    "D_8009DA10_9E610", # ucode_audio        (ROM 0x9E610, 6208 bytes)
    "D_8009F250_9FE50", # ucode_boot (rspboot) (ROM 0x9FE50, 384 bytes)
    "D_8009F3D0_9FFD0", # ucode_f3ddkr_dram  (ROM 0x9FFD0, 4752 bytes)
]


# gen_anim_data.s: `jr $s1` through a 2-entry table at 0x800A7478 whose entry 0 is NULL and entry 1 is the
# instruction right after the delay slot (0x80074E34). N64Recomp cannot size a table starting with NULL.
# Replacing the jr with a nop falls through to the only valid target; behaviour differs only for index 0,
# which would jump to address 0 on hardware.
[[patches.instruction]]
vram = 0x80074E2C
func = "gen_anim_data"
value = 0x00000000

# --- Overlays: keep the runtime's function map in step with the game's own runtime linker (src/runLink.c) ----------
# runlinkDownloadCode, at its osInvalICache call: the overlay has been allocated and copied; $fp = OverlayHeader*.
[[patches.hook]]
func = "runlinkDownloadCode"
before_vram = 0x80052F30
text = "{ void jfg_overlay_loaded(uint8_t*, recomp_context*); jfg_overlay_loaded(rdram, ctx); }"

# runlinkResumeCode, at its romCopy of the text: a suspended overlay's code is being reloaded at its old address
# ($fp = OverlayHeader*). It does not go through runlinkDownloadCode.
[[patches.hook]]
func = "runlinkResumeCode"
before_vram = 0x80053EC4
text = "{ void jfg_overlay_loaded(uint8_t*, recomp_context*); jfg_overlay_loaded(rdram, ctx); }"

# runlinkFreeCode / runlinkUnloadOverlay, at the mmFree of a loaded overlay ($a0 = its address). This is AFTER the
# overlay's own exit function has been called through runlinkCallResumeFunction, which still needs the mapping.
# (runlinkSuspendCode frees through runlinkFreeCode.)
[[patches.hook]]
func = "runlinkFreeCode"
before_vram = 0x800534F4
text = "{ void jfg_overlay_unloading(uint8_t*, recomp_context*); jfg_overlay_unloading(rdram, ctx); }"

[[patches.hook]]
func = "runlinkUnloadOverlay"
before_vram = 0x800537D0
text = "{ void jfg_overlay_unloading(uint8_t*, recomp_context*); jfg_overlay_unloading(rdram, ctx); }"

# --- Direct hardware access in game code ----------------------------------------------------------------------------
# __amHandleFrameMsg (audio manager) has osAiGetLength inlined: `lw $t7, AI_LEN_REG` through KSEG1 (0xA4500004).
# Drop the load and supply the value from the runtime's audio backend instead.
[[patches.instruction]]
vram = 0x80001F2C
func = "__amHandleFrameMsg"
value = 0x00000000 # lw t7, 4(t6) -> nop

[[patches.hook]]
func = "__amHandleFrameMsg"
before_vram = 0x80001F30
text = "{ uint32_t recomp_osAiGetLength(void); ctx->r15 = (gpr)(int32_t)recomp_osAiGetLength(); }"

# --- Anti-tamper checks that touch hardware directly (overlays 111, 133, 156) -----------------------------------------
# osCartTest3_6105 / osCartTest4_6105: wait for PI idle by polling PI_STATUS_REG (0xA4600010), then read a word of
# the cartridge through its KSEG1 mapping (0xB0000454 / 0xB0000A5C, part of the boot code) and compare it with the
# value from a genuine cartridge. Natively: report the PI bus idle, and fetch the word from the user's ROM image,
# so the comparison itself still runs against real data.
[[patches.instruction]]
vram = 0x826E0018
func = "osCartTest3_6105"
value = 0x00001025 # lw v0, 0(v1) [PI_STATUS] -> or v0, zero, zero

[[patches.instruction]]
vram = 0x826E002C
func = "osCartTest3_6105"
value = 0x00001025 # lw v0, 0(v1) [PI_STATUS] -> or v0, zero, zero

[[patches.instruction]]
vram = 0x826E0050
func = "osCartTest3_6105"
value = 0x00000000 # lw v0, 0(t0) [cartridge] -> nop (value supplied by the hook below)

[[patches.hook]]
func = "osCartTest3_6105"
before_vram = 0x826E0054
text = "{ uint32_t jfg_cart_read32(uint32_t); ctx->r2 = (gpr)(int32_t)jfg_cart_read32((uint32_t)ctx->r8); }"

[[patches.instruction]]
vram = 0x82840018
func = "osCartTest4_6105"
value = 0x00001025

[[patches.instruction]]
vram = 0x8284002C
func = "osCartTest4_6105"
value = 0x00001025

[[patches.instruction]]
vram = 0x82840050
func = "osCartTest4_6105"
value = 0x00000000

[[patches.hook]]
func = "osCartTest4_6105"
before_vram = 0x82840054
text = "{ uint32_t jfg_cart_read32(uint32_t); ctx->r2 = (gpr)(int32_t)jfg_cart_read32((uint32_t)ctx->r8); }"

# osRamTest4_6105: reads physical RDRAM 0x2E8 through KSEG1 and expects 0xC86E2000, a leftover of the console's boot
# stage. There is no boot stage here: skip the load and take the branch genuine hardware takes.
[[patches.instruction]]
vram = 0x829B0004
func = "osRamTest4_6105"
value = 0x00000000 # lw t7, 0x2E8(t6) -> nop

[[patches.instruction]]
vram = 0x829B0010
func = "osRamTest4_6105"
value = 0x10000003 # beq t7, at, pass -> b pass

# Per-tick entry point (src/jfg/jfg_tick.cpp): called once per game tick at the entry of the main loop tick.
[[patches.hook]]
func = "func_80044FAC_45BAC"
before_vram = 0x80044FAC
text = "{ void jfg_debug_frame(uint8_t*, recomp_context*); jfg_debug_frame(rdram, ctx); }"

# Right after viFrameSync() returns in the main loop tick ($v0 = frames to simulate); 6 while a cutscene is skipped.
[[patches.hook]]
func = "func_80044FAC_45BAC"
before_vram = 0x800457BC
text = "{ uint32_t jfg_frame_sync(uint8_t*, uint32_t); ctx->r2 = (int32_t)jfg_frame_sync(rdram, (uint32_t)ctx->r2); }"

# "No blood" option: overlay 8's bloodSpurtAdd and bloodHitSpriteAdd (both return nothing) do nothing when it is on.
[[patches.hook]]
func = "bloodSpurtAdd"
before_vram = 0x820801CC
text = "{ int jfg_no_blood(void); if (jfg_no_blood()) { recomp_exit_function(); return; } }"

[[patches.hook]]
func = "bloodHitSpriteAdd"
before_vram = 0x82080334
text = "{ int jfg_no_blood(void); if (jfg_no_blood()) { recomp_exit_function(); return; } }"

# Cutscene skip (src/jfg/jfg_cutscene_skip.cpp, jfg_frame_rate.cpp): after joyRead() in the main loop tick, and at the entry of viFrameSync.
[[patches.hook]]
func = "func_80044FAC_45BAC"
before_vram = 0x80045250
text = "{ void jfg_after_joy(uint8_t*, recomp_context*); jfg_after_joy(rdram, ctx); }"

[[patches.hook]]
func = "viFrameSync"
before_vram = 0x80054FBC
text = "{ int jfg_vi_skip(uint8_t*, recomp_context*); if (jfg_vi_skip(rdram, ctx)) { recomp_exit_function(); return; } }"

# While a cutscene is skipped no graphics task is sent at all (rcpFast3d returns at once, so rcpWaitDP has nothing to
# wait for): the skipped part then runs at the speed of the game logic alone instead of one tick per video frame.
[[patches.hook]]
func = "rcpFast3d"
before_vram = 0x8004DA10
text = "{ int jfg_rcp_skip(uint8_t*, uint32_t); if (jfg_rcp_skip(rdram, (uint32_t)ctx->r6)) { ctx->r2 = 0; recomp_exit_function(); return; } }"

# Sounds started by a skipped cutscene are dropped (they would all be heard at once when the skip ends, and the sound
# player runs out of sound states). ad_sndp_play(bank, sound, volume, pan, pitch, ?, handlePtr): the handle (7th argument, on the stack) is set to NULL.
[[patches.hook]]
func = "ad_sndp_play"
before_vram = 0x80085EEC
text = "{ int jfg_snd_skip(uint8_t*, uint32_t); if (jfg_snd_skip(rdram, (uint32_t)ctx->r29)) { ctx->r2 = 0; recomp_exit_function(); return; } }"

# osSyncPrintf: the game's debug output. Its output routine (0x8009A710) is reached through a function pointer the
# recompiler has no entry for, which stopped the program the first time the game printed a warning (for example
# "out of sound states"). The port prints the format string to stderr instead and returns.
[[patches.hook]]
func = "osSyncPrintf"
before_vram = 0x8009A724
text = "{ void jfg_sync_printf(uint8_t*, recomp_context*); jfg_sync_printf(rdram, ctx); recomp_exit_function(); return; }"

# The other sound-player events the game thread posts during a skipped cutscene (volume, pan and pitch updates of
# sounds that are already playing) are dropped as well; only "stop" events are let through. A skip runs hundreds of
# ticks before the audio thread gets a turn, and the sound player's event queue is small: once it is full the player
# loses its own periodic event and never recovers ("Nonsense sndp event" forever, no more sound effects).
[[patches.hook]]
func = "n_alEvtqPostEvent"
before_vram = 0x8008B610
text = "{ int jfg_evt_skip(uint8_t*, uint32_t, uint32_t); if (jfg_evt_skip(rdram, (uint32_t)ctx->r4, (uint32_t)ctx->r5)) { recomp_exit_function(); return; } }"

# Dual-stick camera (src/jfg/jfg_camera.cpp): right before the scene is drawn (the "jal trackDraw" in the game
# tick), the active camera is moved to the angle the right stick has chosen. Then, at 60 fps, squad members are given
# the in-between positions they are drawn at (src/jfg/jfg_frame_rate.cpp, jfg_squad_draw_begin).
[[patches.hook]]
func = "func_80045F00_46B00"
before_vram = 0x800462A0
text = "{ void jfg_camera_override(uint8_t*, recomp_context*); void jfg_squad_draw_begin(uint8_t*); jfg_camera_override(rdram, ctx); jfg_squad_draw_begin(rdram); }"

# 60 fps: right after trackDraw returns, squad members get their own positions back (src/jfg/jfg_frame_rate.cpp).
[[patches.hook]]
func = "func_80045F00_46B00"
before_vram = 0x800462A8
text = "{ void jfg_squad_draw_end(uint8_t*); jfg_squad_draw_end(rdram); }"

# Field of view option (src/jfg/jfg_visuals.cpp): camSetFOV, where its zoomed and unzoomed paths meet. $f12 = the FOV
# about to be applied (camera->fov already holds the game's own), $t7 = the camera's zoom flag (D_800A3174[camNo]).
[[patches.hook]]
func = "camSetFOV"
before_vram = 0x8003F870
text = "{ float jfg_fov(uint8_t*, float, uint32_t); ctx->f12.fl = jfg_fov(rdram, ctx->f12.fl, (uint32_t)ctx->r15); }"

# Fog options (src/jfg/jfg_visuals.cpp): func_8001BF9C (src/track.c) right after trackGetFog returns, before the fog is
# put in the display list. $sp = its frame (near s16 at +0x3E, far s16 at +0x3C), which jfg_game_fog may rewrite.
[[patches.hook]]
func = "func_8001BF9C_1CB9C"
before_vram = 0x8001BFD4
text = "{ void jfg_game_fog(uint8_t*, uint32_t); jfg_game_fog(rdram, (uint32_t)ctx->r29); }"

# Movement speed options (src/jfg/jfg_controls.cpp): objMoveXYZ(object, dx, dy, dz) moves an object with collision;
# for the player's object the horizontal step is scaled.
[[patches.hook]]
func = "objMoveXYZ"
before_vram = 0x80009A04
text = "{ void jfg_move_scale(uint8_t*, recomp_context*); jfg_move_scale(rdram, ctx); }"

# mainChangeLevel(level, character, entrance?, frontMode, ?, ?) entry: logged with JFG_DEBUG_STATS (src/jfg/jfg_diagnostics.cpp).
[[patches.hook]]
func = "mainChangeLevel"
before_vram = 0x8004665C
text = "{ void jfg_change_level_log(uint8_t*, recomp_context*); jfg_change_level_log(rdram, ctx); }"

# mmAlloc, right after mempool_slot_find returned ($v0 = the block, 0 when the heap has no room): the port retries once
# after mmFlushFreeStack (frees queued with a delay are released at once) and logs both cases (jfg_mm_alloc_check).
[[patches.hook]]
func = "mmAlloc"
before_vram = 0x8004A5FC
text = "{ void jfg_mm_alloc_check(uint8_t*, recomp_context*); jfg_mm_alloc_check(rdram, ctx); }"

# mathBreakPoint, the game's assertion ("break"): logged to bin/jfg_error.log and reported in a message box before the
# process ends (jfg_game_break). Without this the runtime's exit() could crash in its shutdown and leave nothing behind.
[[patches.hook]]
func = "mathBreakPoint"
before_vram = 0x800496AC
text = "{ void jfg_game_break(uint8_t*, recomp_context*); jfg_game_break(rdram, ctx); }"

# 60 fps (F9 -> Options -> Display -> Frame rate). The scheduler holds back the "frame done" message of each frame
# until 2 video retraces have passed since the last one (sc->frameCount at OSSched + 0x300, counted up here in
# __scHandleRetrace; the decomp notes "if you want to make the game 60FPS, change this to 2"), which caps the game at
# 30 fps whatever viFrameSync does. With 60 fps on, every retrace counts twice (jfg_sched_extra_frame returns 1).
[[patches.hook]]
func = "__scHandleRetrace"
before_vram = 0x800506D8
text = "{ int jfg_sched_extra_frame(void); ctx->r8 = (gpr)(int32_t)((int32_t)ctx->r8 + jfg_sched_extra_frame()); }"

# 60 fps, second part: the scheduler only starts a frame's graphics task once the previous frame's buffer swap has
# taken effect (__scTaskReady: VI current framebuffer != next framebuffer -> wait for the next retrace). With the
# runtime's VI that check still sees the swap as pending at the retrace that applies it, which put every frame one more
# retrace behind. (The third part, the main loop's own wait, is jfg_vi_skip in src/jfg.) Letting every task through
# instead made RT64 draw the next frame into the buffer still on screen, which lost the CPU-drawn reticles. So at 60 fps
# the task waits for one retrace since the swap was asked for, counted at the entry of __scHandleRetrace
# (src/jfg/jfg_frame_rate.cpp, jfg_sched_task_ready); at the original rate the game's own check runs.
[[patches.hook]]
func = "__scHandleRetrace"
before_vram = 0x80050154
text = "{ void jfg_sched_retrace(void); jfg_sched_retrace(); }"

[[patches.hook]]
func = "__scTaskReady"
before_vram = 0x800509B0
text = "{ int jfg_sched_task_ready(void); int r = jfg_sched_task_ready(); if (r == 1) { ctx->r2 = ctx->r4; recomp_exit_function(); return; } if (r == 0) { ctx->r2 = 0; recomp_exit_function(); return; } }"

# 60 fps: the squad system (enemies, tribals; overlay 3) at the game's 30 fps cadence (src/jfg/jfg_frame_rate.cpp,
# jfg_squad_frames). Much of it works per tick whatever the frame count, so at 60 fps squad members moved, animated and
# attacked about twice as fast. In 60 fps mode SquaddieControl(obj, frames), SquadronControl(obj, frames) and
# squadsModuleTick(frames) run on every second tick only, with the frames of both ticks.
[[patches.hook]]
func = "SquaddieControl"
before_vram = 0x82030600
text = "{ int jfg_squad_frames(uint8_t*, uint32_t, int); int r = jfg_squad_frames(rdram, (uint32_t)ctx->r4, (int32_t)ctx->r5); if (r == 0) { recomp_exit_function(); return; } ctx->r5 = (gpr)r; }"

[[patches.hook]]
func = "SquadronControl"
before_vram = 0x82034D4C
text = "{ int jfg_squad_frames(uint8_t*, uint32_t, int); int r = jfg_squad_frames(rdram, 0, (int32_t)ctx->r5); if (r == 0) { recomp_exit_function(); return; } ctx->r5 = (gpr)r; }"

[[patches.hook]]
func = "squadsModuleTick"
before_vram = 0x82036990
text = "{ int jfg_squad_frames(uint8_t*, uint32_t, int); int r = jfg_squad_frames(rdram, 0, (int32_t)ctx->r4); if (r == 0) { ctx->r2 = 0; recomp_exit_function(); return; } ctx->r4 = (gpr)r; }"

